name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check the installed command
        run: |
          grok-bots-cli --version
          grok-bots-cli --help
      - name: Check that versions match
        run: |
          v_toml=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          v_pkg=$(grep -m1 '^__version__' src/grok_bots_cli/__init__.py | cut -d'"' -f2)
          test "$v_toml" = "$v_pkg"
          test "$(grok-bots-cli --version)" = "grok-bots-cli $v_pkg"

  install-from-github:
    name: Fresh install from GitHub
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install exactly as the README says
        run: uv tool install --python 3.12 "git+https://github.com/${{ github.repository }}@${{ github.sha }}"
      - name: Run the installed command
        run: |
          export PATH="$(uv tool dir --bin):$PATH"
          grok-bots-cli --version
